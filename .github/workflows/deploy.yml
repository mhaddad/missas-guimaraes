# Publicação na Cloudflare (PLANO §8.5). Na homologação, publica em *.workers.dev (§9.9).
# Só corre depois de configurados a variável CLOUDFLARE_ACCOUNT_ID e o segredo
# CLOUDFLARE_API_TOKEN no ambiente `gravacao` (restrito ao main).
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # reconstrução diária: "hoje" e "próximas" certos no HTML estático
  workflow_dispatch:

permissions:
  contents: read
  actions: read # para saber o commit do último deploy bem sucedido (avisos de publicação)

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  publicar:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: gravacao
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # os avisos de publicação leem os commits desde o deploy anterior
          persist-credentials: false
      # Antes de publicar: o último deploy bem sucedido ainda é o anterior a este.
      - name: Deploy anterior
        id: anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verificar
      - run: npm run build
        env:
          # Chave pública do Turnstile (E2.9); sem ela o "Reportar erro" não aparece.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Pedidos do painel agora visíveis no site → estado PUBLICADO (§8.5).
      - name: Avisar os pedidos publicados
        if: vars.AVISO_URL != ''
        run: npx tsx scripts/avisar-publicacao.ts
        env:
          ANTERIOR: ${{ steps.anterior.outputs.sha }}
          AVISO_URL: ${{ vars.AVISO_URL }}
          AVISO_HMAC: ${{ secrets.AVISO_HMAC }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
