# Testes do site no navegador (§14, E2.11): Playwright com axe (WCAG 2.1 AA) e Lighthouse com os
# orçamentos de §6.9 (desempenho e acessibilidade ≥ 95). Corre em cada PR e em cada push para o main.
name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run lighthouse
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: relatorios
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
