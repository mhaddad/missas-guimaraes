# Calendário litúrgico e civil usado pelo motor de horários.
# Gerado em 2026-10-30. Dias santos de preceito em Portugal (Concordata de 2004); confirmação pela Arquidiocese de Braga pendente (P17).

dias_santos_de_preceito:
  estado: documentado # lista coincide com os dias festivos católicos reconhecidos em Portugal; confirmação pela Arquidiocese de Braga recomendada (P17)
  regras:
  - {id: santa-maria-mae-de-deus, nome: 'Santa Maria, Mãe de Deus', data: '01-01'}
  - {id: corpo-de-deus, nome: 'Corpo de Deus', data_movel: 'pascoa+60'} # quinta-feira
  - {id: assuncao, nome: 'Assunção de Nossa Senhora', data: '08-15'}
  - {id: todos-os-santos, nome: 'Todos os Santos', data: '11-01'}
  - {id: imaculada-conceicao, nome: 'Imaculada Conceição', data: '12-08'}
  - {id: natal, nome: 'Natal do Senhor', data: '12-25'}
  nao_incluidos: [Epifania, Ascensão, São José, São Pedro e São Paulo] # não constam da lista portuguesa; Epifania e Ascensão celebram-se ao domingo

